# ConfigMap containing benchmark configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-config
  namespace: feast-test
data:
  # Common benchmark settings
  PRESET: "quick"
  ITERATIONS: "10"
  WARMUP: "3"
  SLA_P99_MS: "60"
  SLA_THROUGHPUT_RPH: "3000000"
  
  # Feature dimensions
  FEATURES: "50"
  ENTITIES: "1,10,100"
  FV_COUNTS: "1"
  
  # Throughput test
  THROUGHPUT_WORKERS: "1,5,10"
  THROUGHPUT_DURATION: "10"
