apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-config
  labels:
    app.kubernetes.io/name: feast-benchmark
data:
  # ===========================================
  # BENCHMARK SCENARIOS
  # ===========================================
  # Scenarios to run: entity_scaling, feature_scaling, or both
  SCENARIOS: "entity_scaling,feature_scaling"
  
  # Entity Scaling: Fixed features, vary entities
  FIXED_FEATURES: "200"
  ENTITY_COUNTS: "1,10,50,100,200,500"
  
  # Feature Scaling: Fixed entities, vary features  
  FIXED_ENTITIES: "50"
  FEATURE_COUNTS: "5,25,50,100,150,200"
  
  # Legacy vars (kept for backward compatibility)
  FEATURES: "200"
  ENTITIES: "1,10,50,100,500"
  
  # Feature Views: 1, 10, 50, 100+
  FV_COUNTS: "1,10,50,100"
  # Feature Services: 1, 5, 10
  FEATURE_SERVICES: "1,5,10"
  # Transformations: none, python, pandas
  TRANSFORMATIONS: "none,python,pandas"
  # Compression: none, gzip
  COMPRESSION: "none"
  
  # OPTIMIZATION: Increased iterations for statistical significance
  ITERATIONS: "300"
  # OPTIMIZATION: More warmup for steady-state measurement
  WARMUP: "20"
  
  # SLA targets (State Farm)
  SLA_P99_MS: "60"
  SLA_THROUGHPUT_RPH: "3000000"
  
  # Store endpoints (internal cluster DNS)
  REDIS_HOST: "redis.feast-benchmark.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres.feast-benchmark.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "feast"
  
  # ===========================================
  # FEAST CONFIGURATION OPTIMIZATIONS
  # ===========================================
  # These are applied in the benchmark Python scripts
  # See job definitions for implementation details
  #
  # Registry Optimizations:
  #   - cache_ttl_seconds: 0 (infinite cache during benchmark)
  #   - registry pre-cached before measurements
  #
  # Entity Key Serialization:
  #   - entity_key_serialization_version: 3 (latest, most efficient)
  #
  # DynamoDB-specific:
  #   - batch_size: 100 (max for BatchGetItem)
  #   - consistent_reads: false (eventual consistency)
  #   - max_pool_connections: 200
  #   - keepalive_timeout: 60
  #   - connect_timeout: 2
  #   - read_timeout: 5
  #   - retry_mode: adaptive
  #
  # Redis-specific:
  #   - No key TTL overhead during benchmark
  # ===========================================
