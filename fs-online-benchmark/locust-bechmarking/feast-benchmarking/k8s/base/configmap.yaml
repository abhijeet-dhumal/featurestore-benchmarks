apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-config
  labels:
    app.kubernetes.io/name: feast-benchmark
data:
  # Test dimensions - from TRACKER.md
  # Features: 10, 50, 100, 200 (prod: 200)
  FEATURES: "10,50,100,200"
  # Entities: 1, 10, 50, 100, 200, 500 (State Farm: 50, 200)
  ENTITIES: "1,10,50,100,200,500"
  # Feature Views: 1, 10, 50, 100+
  FV_COUNTS: "1,10,50,100"
  # Feature Services: 1, 5, 10
  FEATURE_SERVICES: "1,5,10"
  # Transformations: none, python, pandas
  TRANSFORMATIONS: "none,python,pandas"
  # Compression: none, gzip
  COMPRESSION: "none"
  
  ITERATIONS: "20"
  WARMUP: "5"
  
  # SLA targets (State Farm)
  SLA_P99_MS: "60"
  SLA_THROUGHPUT_RPH: "3000000"
  
  # Store endpoints (internal cluster DNS)
  REDIS_HOST: "redis.feast-benchmark.svc.cluster.local"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres.feast-benchmark.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "feast"
