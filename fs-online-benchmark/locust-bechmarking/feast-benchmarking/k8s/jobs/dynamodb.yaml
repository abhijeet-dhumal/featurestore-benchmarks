# DynamoDB benchmark job - runs IN-CLUSTER for accurate latency measurement
apiVersion: batch/v1
kind: Job
metadata:
  name: feast-benchmark-dynamodb
  namespace: feast-test
  labels:
    app: feast-benchmark
    store: dynamodb
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: feast-benchmark
        store: dynamodb
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/tmp
              export PATH=$HOME/.local/bin:$PATH
              echo "=== Installing dependencies ==="
              pip install --user -q 'feast[aws]' aiobotocore pandas matplotlib numpy
              
              echo "=== Creating benchmark script ==="
              cat > /tmp/run_benchmark.py << 'SCRIPT'
              import json
              import os
              import statistics
              import time
              from datetime import datetime, timedelta
              from dataclasses import dataclass, asdict
              from typing import List
              
              import pandas as pd
              from feast import Entity, FeatureStore, FeatureView, Field, FileSource
              from feast.types import Float64
              
              @dataclass
              class Result:
                  store: str
                  num_features: int
                  num_entities: int
                  p50: float
                  p95: float
                  p99: float
                  mean: float
                  sla_pass: bool
              
              def create_repo(region: str) -> str:
                  import shutil
                  repo_path = "/tmp/feast_repo"
                  shutil.rmtree(repo_path, ignore_errors=True)
                  os.makedirs(repo_path, exist_ok=True)
                  
                  config = f"""
              project: benchmark
              registry: {repo_path}/registry.db
              provider: local
              online_store:
                type: dynamodb
                region: {region}
              """
                  with open(f"{repo_path}/feature_store.yaml", "w") as f:
                      f.write(config)
                  return repo_path
              
              def create_data_and_features(repo_path: str, num_features: int, num_rows: int = 1000):
                  data = {"user_id": [f"user_{i}" for i in range(num_rows)]}
                  for i in range(num_features):
                      data[f"f{i}"] = [float(i * j) for j in range(num_rows)]
                  df = pd.DataFrame(data)
                  df["event_timestamp"] = pd.Timestamp.now()
                  
                  parquet_path = f"{repo_path}/data.parquet"
                  df.to_parquet(parquet_path)
                  
                  source = FileSource(path=parquet_path, timestamp_field="event_timestamp")
                  entity = Entity(name="user_id", join_keys=["user_id"])
                  
                  schema = [Field(name=f"f{i}", dtype=Float64) for i in range(num_features)]
                  fv = FeatureView(name="fv", entities=[entity], schema=schema, source=source, ttl=timedelta(days=1))
                  
                  return entity, fv
              
              def run_benchmark():
                  SLA_MS = float(os.environ.get("SLA_P99_MS", "60"))
                  ITERATIONS = int(os.environ.get("ITERATIONS", "20"))
                  WARMUP = int(os.environ.get("WARMUP", "5"))
                  
                  region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
                  
                  features_list = [int(x) for x in os.environ.get("FEATURES", "50").split(",")]
                  entities_list = [int(x) for x in os.environ.get("ENTITIES", "1,10,100").split(",")]
                  
                  print("=" * 70)
                  print("FEAST BENCHMARK - DYNAMODB (IN-CLUSTER)")
                  print("=" * 70)
                  print(f"DynamoDB Region: {region}")
                  print(f"Features: {features_list}")
                  print(f"Entities: {entities_list}")
                  print(f"Iterations: {ITERATIONS}, Warmup: {WARMUP}")
                  print(f"SLA p99: {SLA_MS}ms")
                  print("=" * 70)
                  
                  results = []
                  
                  for num_features in features_list:
                      repo_path = create_repo(region)
                      entity, fv = create_data_and_features(repo_path, num_features)
                      
                      fs = FeatureStore(repo_path=repo_path)
                      fs.apply([entity, fv])
                      fs.materialize(
                          start_date=datetime.now() - timedelta(days=1),
                          end_date=datetime.now()
                      )
                      
                      feature_refs = [f"fv:f{i}" for i in range(num_features)]
                      
                      for num_entities in entities_list:
                          entity_rows = [{"user_id": f"user_{i}"} for i in range(num_entities)]
                          
                          # Warmup
                          for _ in range(WARMUP):
                              fs.get_online_features(features=feature_refs, entity_rows=entity_rows)
                          
                          # Benchmark
                          latencies = []
                          for _ in range(ITERATIONS):
                              start = time.perf_counter()
                              fs.get_online_features(features=feature_refs, entity_rows=entity_rows)
                              latencies.append((time.perf_counter() - start) * 1000)
                          
                          latencies.sort()
                          p50 = latencies[len(latencies)//2]
                          p95 = latencies[int(len(latencies)*0.95)]
                          p99 = latencies[-1]
                          mean = statistics.mean(latencies)
                          
                          sla_pass = p99 < SLA_MS
                          status = "PASS" if sla_pass else "FAIL"
                          
                          print(f"\n{num_features}f x {num_entities}e:")
                          print(f"  p50: {p50:.1f}ms | p95: {p95:.1f}ms | p99: {p99:.1f}ms [{status}]")
                          
                          results.append(Result(
                              store="dynamodb",
                              num_features=num_features,
                              num_entities=num_entities,
                              p50=p50, p95=p95, p99=p99, mean=mean,
                              sla_pass=sla_pass
                          ))
                  
                  # Save results
                  output = {
                      "store": "dynamodb",
                      "timestamp": datetime.now().isoformat(),
                      "config": {"features": features_list, "entities": entities_list},
                      "latency": [asdict(r) for r in results]
                  }
                  
                  with open("/results/benchmark_results.json", "w") as f:
                      json.dump(output, f, indent=2)
                  
                  print("\n" + "=" * 70)
                  print("RESULTS SUMMARY")
                  print("=" * 70)
                  for r in results:
                      status = "PASS" if r.sla_pass else "FAIL"
                      print(f"{r.num_features}f x {r.num_entities}e: p99={r.p99:.1f}ms [{status}]")
                  
                  print(f"\nResults saved to /results/benchmark_results.json")
                  return results
              
              if __name__ == "__main__":
                  run_benchmark()
              SCRIPT
              
              echo "=== Running benchmark ==="
              python /tmp/run_benchmark.py
              
              echo "=== Results ==="
              cat /results/benchmark_results.json
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_DEFAULT_REGION
                  optional: true
            - name: FEATURES
              value: "50"
            - name: ENTITIES
              value: "1,10,100"
            - name: ITERATIONS
              value: "20"
            - name: WARMUP
              value: "5"
            - name: SLA_P99_MS
              value: "60"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
