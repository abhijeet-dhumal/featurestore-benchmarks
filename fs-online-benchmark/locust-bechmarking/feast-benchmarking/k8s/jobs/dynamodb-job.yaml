apiVersion: batch/v1
kind: Job
metadata:
  name: feast-benchmark-dynamodb
  labels:
    app: feast-benchmark
    store: dynamodb
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: feast-benchmark
        store: dynamodb
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: python:3.11-slim
          envFrom:
            - configMapRef:
                name: benchmark-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_DEFAULT_REGION
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: results
              mountPath: /results
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/tmp
              export PATH=$HOME/.local/bin:$PATH
              export PYTHONUNBUFFERED=1
              
              echo "=== STEP 1/5: Installing dependencies ==="
              pip install --user -q 'feast[aws]' aiobotocore pandas numpy
              echo "✓ Dependencies installed"
              
              echo "=== STEP 2/5: Running benchmark ==="
              python3 -u << 'PYTHON_EOF'
              """Optimized DynamoDB Benchmark with verbose progress."""
              import cProfile, pstats, io, json, os, shutil, statistics, time, sys
              from datetime import datetime, timedelta
              from dataclasses import dataclass, asdict, field
              from typing import List, Dict, Tuple
              import pandas as pd
              from feast import Entity, FeatureStore, FeatureView, Field, FileSource
              from feast.types import Float64
              
              def log(msg): print(f"[{datetime.now().strftime('%H:%M:%S')}] {msg}", flush=True)
              
              @dataclass
              class Result:
                  test_type: str
                  num_features: int
                  num_entities: int
                  num_feature_views: int
                  online_store: str
                  transformation_mode: str
                  p50: float
                  p95: float
                  p99: float
                  mean: float
                  min_val: float
                  max_val: float
                  std_dev: float
                  rps: float
                  rph: float
                  online_read_pct: float
                  protobuf_convert_pct: float
                  entity_serial_pct: float
                  other_pct: float
                  sla_target_ms: float
                  sla_pass: bool
                  timestamp: str
                  feast_version: str
              
              def profile_request(fs, features, entity_rows) -> Tuple[float, Dict[str, float]]:
                  profiler = cProfile.Profile()
                  start = time.perf_counter()
                  profiler.enable()
                  fs.get_online_features(features=features, entity_rows=entity_rows)
                  profiler.disable()
                  total_ms = (time.perf_counter() - start) * 1000
                  
                  stats = pstats.Stats(profiler)
                  function_times = {}
                  for func, (cc, nc, tt, ct, callers) in stats.stats.items():
                      _, _, funcname = func
                      function_times[funcname] = function_times.get(funcname, 0) + tt * 1000
                  
                  online_read = function_times.get('online_read', 0) + function_times.get('_get_online_features_from_online_store', 0)
                  protobuf = function_times.get('_convert_rows_to_protobuf', 0) + function_times.get('construct_response_feature_vector', 0)
                  entity_serial = function_times.get('serialize_entity_key', 0)
                  
                  breakdown = {
                      'online_read_pct': (online_read / total_ms * 100) if total_ms > 0 else 0,
                      'protobuf_convert_pct': (protobuf / total_ms * 100) if total_ms > 0 else 0,
                      'entity_serial_pct': (entity_serial / total_ms * 100) if total_ms > 0 else 0,
                  }
                  breakdown['other_pct'] = max(0, 100 - sum(breakdown.values()))
                  return total_ms, breakdown
              
              def run():
                  import feast
                  repo = "/tmp/feast_repo"
                  shutil.rmtree(repo, ignore_errors=True)
                  os.makedirs(repo, exist_ok=True)
                  
                  region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
                  
                  log("=== STEP 3/5: Creating Feast repository ===")
                  config = f"""project: benchmark
              provider: local
              registry:
                path: {repo}/registry.db
                cache_ttl_seconds: 0
              online_store:
                type: dynamodb
                region: {region}
                batch_size: 100
                consistent_reads: false
                max_pool_connections: 200
                keepalive_timeout: 60.0
                connect_timeout: 2
                read_timeout: 5
                retry_mode: adaptive
                total_max_retry_attempts: 3
              entity_key_serialization_version: 3
              """
                  with open(f"{repo}/feature_store.yaml", "w") as f:
                      f.write(config)
                  log(f"✓ Config written: DynamoDB region={region}")
                  
                  NUM_FEATURES = int(os.environ.get("FEATURES", "200"))
                  ENTITIES = [int(x) for x in os.environ.get("ENTITIES", "1,10,50,100,500").split(",")]
                  # DynamoDB needs more iterations due to network variance + throttling
                  ITERATIONS = int(os.environ.get("ITERATIONS", "500"))
                  WARMUP = int(os.environ.get("WARMUP", "30"))
                  SLA = float(os.environ.get("SLA_P99_MS", "60"))
                  PROFILE_ITERS = 5
                  
                  log(f"Creating dataset: {NUM_FEATURES} features, {max(ENTITIES)+100} entities...")
                  max_entities = max(ENTITIES) + 100
                  data = {"user_id": [f"user_{i}" for i in range(max_entities)]}
                  for i in range(NUM_FEATURES):
                      data[f"f{i}"] = [float(i*j) for j in range(max_entities)]
                  df = pd.DataFrame(data)
                  df["event_timestamp"] = pd.Timestamp.now()
                  df.to_parquet(f"{repo}/data.parquet")
                  log("✓ Dataset created")
                  
                  source = FileSource(path=f"{repo}/data.parquet", timestamp_field="event_timestamp")
                  entity = Entity(name="user_id", join_keys=["user_id"])
                  schema = [Field(name=f"f{i}", dtype=Float64) for i in range(NUM_FEATURES)]
                  fv = FeatureView(name="fv", entities=[entity], schema=schema, source=source, ttl=timedelta(days=1))
                  
                  fs = FeatureStore(repo_path=repo)
                  log("Applying feature definitions...")
                  fs.apply([entity, fv])
                  log("✓ Features applied")
                  
                  log("=== STEP 4/5: Materializing to DynamoDB ===")
                  fs.materialize(start_date=datetime.now()-timedelta(days=1), end_date=datetime.now())
                  log("✓ Materialization complete")
                  
                  fs.refresh_registry()
                  features = [f"fv:f{i}" for i in range(NUM_FEATURES)]
                  results = []
                  
                  print("=" * 70, flush=True)
                  print(f"DYNAMODB BENCHMARK - region: {region}", flush=True)
                  print(f"Features: {NUM_FEATURES} | Iterations: {ITERATIONS} | Warmup: {WARMUP}", flush=True)
                  print("=" * 70, flush=True)
                  
                  log("=== STEP 5/5: Running benchmarks ===")
                  for idx, n in enumerate(ENTITIES):
                      log(f"Benchmarking {n} entities ({idx+1}/{len(ENTITIES)})...")
                      rows = [{"user_id": f"user_{i}"} for i in range(n)]
                      
                      for w in range(WARMUP):
                          fs.get_online_features(features=features, entity_rows=rows)
                          if w % 5 == 0:
                              print(f"  Warmup: {w+1}/{WARMUP}", end='\r', flush=True)
                      print(f"  Warmup: {WARMUP}/{WARMUP} ✓", flush=True)
                      
                      times = []
                      for i in range(ITERATIONS):
                          start = time.perf_counter()
                          fs.get_online_features(features=features, entity_rows=rows)
                          times.append((time.perf_counter()-start)*1000)
                          if (i+1) % 20 == 0:
                              print(f"  Iteration: {i+1}/{ITERATIONS}", end='\r', flush=True)
                      print(f"  Iteration: {ITERATIONS}/{ITERATIONS} ✓", flush=True)
                      times.sort()
                      
                      breakdowns = []
                      for p in range(PROFILE_ITERS):
                          _, bd = profile_request(fs, features, rows)
                          breakdowns.append(bd)
                      avg_breakdown = {k: statistics.mean([b[k] for b in breakdowns]) for k in breakdowns[0]}
                      
                      p99_idx = int(len(times)*0.99)
                      r = Result(
                          test_type="latency", num_features=NUM_FEATURES, num_entities=n,
                          num_feature_views=1, online_store="dynamodb", transformation_mode=None,
                          p50=times[len(times)//2], p95=times[int(len(times)*0.95)], p99=times[p99_idx],
                          mean=statistics.mean(times), min_val=min(times), max_val=max(times),
                          std_dev=statistics.stdev(times) if len(times) > 1 else 0,
                          rps=1000/statistics.mean(times) if statistics.mean(times) > 0 else 0, rph=0,
                          online_read_pct=avg_breakdown['online_read_pct'],
                          protobuf_convert_pct=avg_breakdown['protobuf_convert_pct'],
                          entity_serial_pct=avg_breakdown['entity_serial_pct'],
                          other_pct=avg_breakdown['other_pct'],
                          sla_target_ms=SLA, sla_pass=times[p99_idx] < SLA,
                          timestamp=datetime.now().isoformat(), feast_version=feast.__version__
                      )
                      results.append(r)
                      status = "✅ PASS" if r.sla_pass else "❌ FAIL"
                      cv = (r.std_dev / r.mean * 100) if r.mean > 0 else 0
                      cv_status = "✓" if cv < 15 else "⚠" if cv < 25 else "✗"
                      print(f"  → {n:4d}e: p50={r.p50:7.1f}ms | p95={r.p95:7.1f}ms | p99={r.p99:7.1f}ms [{status}]", flush=True)
                      print(f"          mean={r.mean:7.1f}ms | std={r.std_dev:6.1f}ms | CV={cv:5.1f}% {cv_status}", flush=True)
                  
                  os.makedirs("/results/dynamodb", exist_ok=True)
                  output = {
                      "summary": {
                          "store": "dynamodb", "feast_version": feast.__version__,
                          "timestamp": datetime.now().isoformat(),
                          "total_tests": len(results),
                          "sla_pass_rate": sum(1 for r in results if r.sla_pass) / len(results) * 100
                      },
                      "latency": [asdict(r) for r in results],
                      "fv_scaling": [], "transformations": [], "throughput": []
                  }
                  with open("/results/dynamodb/benchmark_results.json", "w") as f:
                      json.dump(output, f, indent=2)
                  
                  print("=" * 70, flush=True)
                  passed = sum(1 for r in results if r.sla_pass)
                  log(f"Complete! SLA Pass Rate: {passed}/{len(results)} ({100*passed/len(results):.0f}%)")
                  log(f"Results saved to /results/dynamodb/benchmark_results.json")
              
              if __name__ == "__main__":
                  run()
              PYTHON_EOF
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: benchmark-results
