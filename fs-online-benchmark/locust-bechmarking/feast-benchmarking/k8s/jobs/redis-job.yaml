apiVersion: batch/v1
kind: Job
metadata:
  name: feast-benchmark-redis
  labels:
    app: feast-benchmark
    store: redis
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: feast-benchmark
        store: redis
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: python:3.11-slim
          envFrom:
            - configMapRef:
                name: benchmark-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: results
              mountPath: /results
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/tmp
              export PATH=$HOME/.local/bin:$PATH
              pip install --user -q feast 'redis>=4.0.0' pandas numpy
              
              python3 << 'PYTHON_EOF'
              """
              Optimized Redis Benchmark with all performance tuning applied.
              """
              import json, os, statistics, time
              from datetime import datetime, timedelta
              from dataclasses import dataclass, asdict, field
              from typing import List
              import pandas as pd
              from feast import Entity, FeatureStore, FeatureView, Field, FileSource
              from feast.types import Float64
              
              @dataclass
              class Result:
                  store: str
                  num_features: int
                  num_entities: int
                  p50: float
                  p95: float
                  p99: float
                  mean: float
                  min_val: float
                  max_val: float
                  std_dev: float
                  sla_pass: bool
                  optimizations: List[str] = field(default_factory=list)
              
              def run():
                  import shutil
                  repo = "/tmp/feast_repo"
                  shutil.rmtree(repo, ignore_errors=True)
                  os.makedirs(repo, exist_ok=True)
                  
                  redis_host = os.environ.get("REDIS_HOST", "redis")
                  redis_port = os.environ.get("REDIS_PORT", "6379")
                  
                  # OPTIMIZED config with cache_ttl=0 and entity_key_serialization_version=3
                  config = f"""project: benchmark
              provider: local
              registry:
                path: {repo}/registry.db
                cache_ttl_seconds: 0
              online_store:
                type: redis
                connection_string: {redis_host}:{redis_port}
              entity_key_serialization_version: 3
              """
                  with open(f"{repo}/feature_store.yaml", "w") as f:
                      f.write(config)
                  
                  NUM_FEATURES = int(os.environ.get("FEATURES", "200"))
                  ENTITIES = [int(x) for x in os.environ.get("ENTITIES", "1,10,50,100,500").split(",")]
                  ITERATIONS = int(os.environ.get("ITERATIONS", "100"))
                  WARMUP = int(os.environ.get("WARMUP", "10"))
                  SLA = float(os.environ.get("SLA_P99_MS", "60"))
                  
                  max_entities = max(ENTITIES) + 100
                  data = {"user_id": [f"user_{i}" for i in range(max_entities)]}
                  for i in range(NUM_FEATURES):
                      data[f"f{i}"] = [float(i*j) for j in range(max_entities)]
                  df = pd.DataFrame(data)
                  df["event_timestamp"] = pd.Timestamp.now()
                  df.to_parquet(f"{repo}/data.parquet")
                  
                  source = FileSource(path=f"{repo}/data.parquet", timestamp_field="event_timestamp")
                  entity = Entity(name="user_id", join_keys=["user_id"])
                  schema = [Field(name=f"f{i}", dtype=Float64) for i in range(NUM_FEATURES)]
                  fv = FeatureView(name="fv", entities=[entity], schema=schema, source=source, ttl=timedelta(days=1))
                  
                  fs = FeatureStore(repo_path=repo)
                  fs.apply([entity, fv])
                  fs.materialize(start_date=datetime.now()-timedelta(days=1), end_date=datetime.now())
                  fs.refresh_registry()
                  
                  features = [f"fv:f{i}" for i in range(NUM_FEATURES)]
                  results = []
                  optimizations = ["cache_ttl=0", "entity_key_v3", f"iter={ITERATIONS}", f"warmup={WARMUP}"]
                  
                  print("="*70)
                  print(f"REDIS BENCHMARK (OPTIMIZED) - {redis_host}:{redis_port}")
                  print(f"Features: {NUM_FEATURES} | Iterations: {ITERATIONS} | Warmup: {WARMUP}")
                  print("="*70)
                  
                  for n in ENTITIES:
                      rows = [{"user_id": f"user_{i}"} for i in range(n)]
                      for _ in range(WARMUP):
                          fs.get_online_features(features=features, entity_rows=rows)
                      
                      times = []
                      for _ in range(ITERATIONS):
                          start = time.perf_counter()
                          fs.get_online_features(features=features, entity_rows=rows)
                          times.append((time.perf_counter()-start)*1000)
                      times.sort()
                      
                      p99_idx = int(len(times)*0.99)
                      r = Result("redis", NUM_FEATURES, n, times[len(times)//2], times[int(len(times)*0.95)],
                                 times[p99_idx], statistics.mean(times), min(times), max(times),
                                 statistics.stdev(times) if len(times) > 1 else 0, times[p99_idx] < SLA, optimizations)
                      results.append(r)
                      status = "PASS" if r.sla_pass else "FAIL"
                      print(f"{n:4d}e: p50={r.p50:7.1f}ms | p95={r.p95:7.1f}ms | p99={r.p99:7.1f}ms | std={r.std_dev:5.1f}ms [{status}]")
                  
                  os.makedirs("/results/redis", exist_ok=True)
                  output = {"store": "redis", "timestamp": datetime.now().isoformat(),
                            "config": {"features": NUM_FEATURES, "iterations": ITERATIONS, "warmup": WARMUP,
                                       "sla_ms": SLA, "optimizations": optimizations},
                            "latency": [asdict(r) for r in results]}
                  with open("/results/redis/benchmark_results.json", "w") as f:
                      json.dump(output, f, indent=2)
                  
                  print(f"\nSaved: /results/redis/benchmark_results.json")
                  passed = sum(1 for r in results if r.sla_pass)
                  print(f"SLA Pass Rate: {passed}/{len(results)} ({100*passed/len(results):.0f}%)")
              
              if __name__ == "__main__":
                  run()
              PYTHON_EOF
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: benchmark-results
