# Deep profiling benchmark - breaks down online_read internals
apiVersion: batch/v1
kind: Job
metadata:
  name: feast-benchmark-profile-deep
  namespace: feast-test
  labels:
    app: feast-benchmark
    store: profile-deep
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: feast-benchmark
        store: profile-deep
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export HOME=/tmp
              export PATH=$HOME/.local/bin:$PATH
              echo "=== Installing dependencies ==="
              pip install --user -q feast 'redis>=4.0.0' 'psycopg[binary,pool]>=3.0.0' 'feast[aws]' aiobotocore pandas numpy
              
              echo "=== Creating deep profiling script ==="
              cat > /tmp/deep_profile.py << 'SCRIPT'
              import cProfile
              import io
              import json
              import os
              import pstats
              import time
              from datetime import datetime, timedelta
              from typing import Dict, List, Any
              
              import pandas as pd
              from feast import Entity, FeatureStore, FeatureView, Field, FileSource
              from feast.types import Float64
              
              def create_repo(store_type: str, store_config: dict) -> str:
                  import shutil
                  repo_path = "/tmp/feast_repo"
                  shutil.rmtree(repo_path, ignore_errors=True)
                  os.makedirs(repo_path, exist_ok=True)
                  
                  if store_type == "postgres":
                      config = f"""
              project: benchmark
              registry: {repo_path}/registry.db
              provider: local
              online_store:
                type: postgres
                host: {store_config['host']}
                port: {store_config['port']}
                database: {store_config['database']}
                user: {store_config['user']}
                password: {store_config['password']}
              """
                  elif store_type == "dynamodb":
                      config = f"""
              project: benchmark
              registry: {repo_path}/registry.db
              provider: local
              online_store:
                type: dynamodb
                region: {store_config.get('region', 'eu-west-1')}
              """
                  else:
                      config = f"""
              project: benchmark
              registry: {repo_path}/registry.db
              provider: local
              online_store:
                type: {store_type}
              """
                      for k, v in store_config.items():
                          config += f"  {k}: {v}\n"
                  
                  with open(f"{repo_path}/feature_store.yaml", "w") as f:
                      f.write(config)
                  return repo_path
              
              def create_data_and_features(repo_path: str, num_features: int, num_rows: int = 1000):
                  data = {"user_id": [f"user_{i}" for i in range(num_rows)]}
                  for i in range(num_features):
                      data[f"f{i}"] = [float(i * j) for j in range(num_rows)]
                  df = pd.DataFrame(data)
                  df["event_timestamp"] = pd.Timestamp.now()
                  
                  parquet_path = f"{repo_path}/data.parquet"
                  df.to_parquet(parquet_path)
                  
                  source = FileSource(path=parquet_path, timestamp_field="event_timestamp")
                  entity = Entity(name="user_id", join_keys=["user_id"])
                  
                  schema = [Field(name=f"f{i}", dtype=Float64) for i in range(num_features)]
                  fv = FeatureView(name="fv", entities=[entity], schema=schema, source=source, ttl=timedelta(days=1))
                  
                  return entity, fv
              
              def extract_online_read_breakdown(stats: pstats.Stats, store_type: str) -> Dict[str, float]:
                  """Extract timing breakdown for online_read internals."""
                  breakdown = {}
                  
                  # Key functions to look for by store type
                  key_patterns = {
                      "sqlite": [
                          ("execute", "SQL execute"),
                          ("fetchall", "Fetch results"),
                          ("cursor", "Cursor ops"),
                          ("connect", "Connection"),
                      ],
                      "redis": [
                          ("pipeline", "Pipeline create"),
                          ("execute", "Pipeline execute"),
                          ("mget", "MGET command"),
                          ("hgetall", "HGETALL"),
                          ("_send_command", "Send command"),
                          ("read_response", "Read response"),
                          ("parse_response", "Parse response"),
                          ("pack_command", "Pack command"),
                      ],
                      "postgres": [
                          ("execute", "SQL execute"),
                          ("fetchall", "Fetch results"),
                          ("cursor", "Cursor ops"),
                          ("_execute", "PG execute"),
                          ("send", "Network send"),
                          ("recv", "Network recv"),
                      ],
                      "dynamodb": [
                          ("batch_get_item", "BatchGetItem API"),
                          ("_make_request", "Make request"),
                          ("_send", "HTTP send"),
                          ("_convert_value", "Convert value"),
                          ("_read", "HTTP read"),
                      ],
                  }
                  
                  patterns = key_patterns.get(store_type, [])
                  
                  for func, (cc, nc, tt, ct, callers) in stats.stats.items():
                      filename, lineno, funcname = func
                      for pattern, label in patterns:
                          if pattern in funcname.lower():
                              if label not in breakdown:
                                  breakdown[label] = 0
                              breakdown[label] += ct * 1000  # Convert to ms
                  
                  # Also capture general categories
                  for func, (cc, nc, tt, ct, callers) in stats.stats.items():
                      filename, lineno, funcname = func
                      
                      # Protobuf
                      if 'protobuf' in filename.lower() or 'proto' in funcname.lower():
                          if "Protobuf" not in breakdown:
                              breakdown["Protobuf"] = 0
                          breakdown["Protobuf"] += ct * 1000
                      
                      # Serialization
                      if 'serial' in funcname.lower() or 'serialize' in funcname.lower():
                          if "Serialization" not in breakdown:
                              breakdown["Serialization"] = 0
                          breakdown["Serialization"] += ct * 1000
                      
                      # Entity key
                      if 'entity' in funcname.lower() and 'key' in funcname.lower():
                          if "Entity Key" not in breakdown:
                              breakdown["Entity Key"] = 0
                          breakdown["Entity Key"] += ct * 1000
                  
                  return breakdown
              
              def run_deep_profile():
                  STORES = {
                      "sqlite": {"path": "/tmp/feast_repo/online.db"},
                      "redis": {"connection_string": f"{os.environ.get('REDIS_HOST', 'redis')}:{os.environ.get('REDIS_PORT', '6379')}"},
                      "postgres": {
                          "host": os.environ.get("POSTGRES_HOST", "postgres"),
                          "port": os.environ.get("POSTGRES_PORT", "5432"),
                          "database": os.environ.get("POSTGRES_DATABASE", "feast"),
                          "user": os.environ.get("POSTGRES_USER", "feast"),
                          "password": os.environ.get("POSTGRES_PASSWORD", "feast"),
                      },
                      "dynamodb": {
                          "region": os.environ.get("AWS_DEFAULT_REGION", "eu-west-1"),
                      },
                  }
                  
                  NUM_FEATURES = 50
                  NUM_ENTITIES = 100
                  ITERATIONS = 10
                  
                  results = {}
                  
                  print("=" * 80)
                  print("DEEP PROFILING: online_read() BREAKDOWN")
                  print("=" * 80)
                  print(f"Config: {NUM_FEATURES} features, {NUM_ENTITIES} entities, {ITERATIONS} iterations")
                  print("=" * 80)
                  
                  for store_name, store_config in STORES.items():
                      print(f"\n{'='*80}")
                      print(f"STORE: {store_name.upper()}")
                      print("=" * 80)
                      
                      try:
                          repo_path = create_repo(store_name, store_config)
                          entity, fv = create_data_and_features(repo_path, NUM_FEATURES)
                          
                          fs = FeatureStore(repo_path=repo_path)
                          fs.apply([entity, fv])
                          fs.materialize(
                              start_date=datetime.now() - timedelta(days=1),
                              end_date=datetime.now()
                          )
                          
                          feature_refs = [f"fv:f{i}" for i in range(NUM_FEATURES)]
                          entity_rows = [{"user_id": f"user_{i}"} for i in range(NUM_ENTITIES)]
                          
                          # Warmup
                          for _ in range(3):
                              fs.get_online_features(features=feature_refs, entity_rows=entity_rows)
                          
                          # Profile
                          profiler = cProfile.Profile()
                          
                          total_times = []
                          for _ in range(ITERATIONS):
                              start = time.perf_counter()
                              profiler.enable()
                              fs.get_online_features(features=feature_refs, entity_rows=entity_rows)
                              profiler.disable()
                              total_times.append((time.perf_counter() - start) * 1000)
                          
                          avg_total = sum(total_times) / len(total_times)
                          p99_total = sorted(total_times)[-1]
                          
                          # Get stats
                          stats = pstats.Stats(profiler)
                          stats.strip_dirs()
                          
                          # Extract high-level breakdown
                          high_level = {}
                          for func, (cc, nc, tt, ct, callers) in stats.stats.items():
                              filename, lineno, funcname = func
                              ct_ms = ct * 1000 / ITERATIONS
                              
                              if funcname == "online_read":
                                  high_level["online_read"] = ct_ms
                              elif funcname == "_prepare_entities_to_read_from_online_store":
                                  high_level["prepare_entities"] = ct_ms
                              elif funcname == "_get_online_request_context":
                                  high_level["request_context"] = ct_ms
                              elif funcname == "get_online_features":
                                  high_level["total_get_online_features"] = ct_ms
                              elif "serialize_entity_key" in funcname:
                                  high_level["serialize_entity_key"] = ct_ms
                              elif "_proto_value_to_value" in funcname or "proto" in funcname.lower():
                                  if "proto_convert" not in high_level:
                                      high_level["proto_convert"] = 0
                                  high_level["proto_convert"] += ct_ms
                          
                          # Extract detailed online_read breakdown
                          detailed = extract_online_read_breakdown(stats, store_name)
                          
                          print(f"\nTotal: avg={avg_total:.1f}ms, p99={p99_total:.1f}ms")
                          
                          print(f"\n--- High-Level Breakdown ---")
                          for name, time_ms in sorted(high_level.items(), key=lambda x: x[1], reverse=True):
                              pct = (time_ms / avg_total) * 100 if avg_total > 0 else 0
                              print(f"  {name:40s} {time_ms:8.2f}ms ({pct:5.1f}%)")
                          
                          print(f"\n--- online_read() Internals ---")
                          for name, time_ms in sorted(detailed.items(), key=lambda x: x[1], reverse=True)[:10]:
                              pct = (time_ms / avg_total) * 100 if avg_total > 0 else 0
                              print(f"  {name:40s} {time_ms:8.2f}ms ({pct:5.1f}%)")
                          
                          results[store_name] = {
                              "avg_ms": round(avg_total, 2),
                              "p99_ms": round(p99_total, 2),
                              "high_level": {k: round(v, 2) for k, v in high_level.items()},
                              "online_read_breakdown": {k: round(v, 2) for k, v in detailed.items()},
                          }
                          
                      except Exception as e:
                          print(f"Error profiling {store_name}: {e}")
                          results[store_name] = {"error": str(e)}
                  
                  # Summary comparison
                  print("\n" + "=" * 80)
                  print("COMPARISON: online_read() Internals (100 entities)")
                  print("=" * 80)
                  
                  # Collect all breakdown keys
                  all_keys = set()
                  for store_data in results.values():
                      if "online_read_breakdown" in store_data:
                          all_keys.update(store_data["online_read_breakdown"].keys())
                  
                  # Print header
                  stores = [s for s in results.keys() if "error" not in results[s]]
                  print(f"\n{'Component':<30}", end="")
                  for store in stores:
                      print(f" {store:>12}", end="")
                  print()
                  print("-" * (30 + 13 * len(stores)))
                  
                  for key in sorted(all_keys):
                      print(f"{key:<30}", end="")
                      for store in stores:
                          val = results[store].get("online_read_breakdown", {}).get(key, 0)
                          print(f" {val:>12.2f}", end="")
                      print()
                  
                  # Save results
                  output = {
                      "timestamp": datetime.now().isoformat(),
                      "config": {
                          "features": NUM_FEATURES,
                          "entities": NUM_ENTITIES,
                          "iterations": ITERATIONS
                      },
                      "results": results
                  }
                  
                  with open("/results/deep_profile_results.json", "w") as f:
                      json.dump(output, f, indent=2)
                  
                  print(f"\n\nResults saved to /results/deep_profile_results.json")
              
              if __name__ == "__main__":
                  run_deep_profile()
              SCRIPT
              
              echo "=== Running deep profiler ==="
              python /tmp/deep_profile.py
              
              echo "=== Results ==="
              cat /results/deep_profile_results.json
          env:
            - name: REDIS_HOST
              value: "redis.feast-test.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_HOST
              value: "postgres.feast-test.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: "feast"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_DEFAULT_REGION
                  optional: true
          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
